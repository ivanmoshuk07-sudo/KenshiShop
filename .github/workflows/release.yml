name: Build KenshiShop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua for code checks
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate Lua and behavior with fake engine objects
        run: |
          find KenshiShop/scripts -name '*.lua' -print0 | xargs -0 -n 1 luac -p
          lua Development/tests/member_index.lua KenshiShop/scripts
          lua Development/tests/monitor_queue.lua KenshiShop/scripts
          lua Development/tests/supply_queue.lua KenshiShop/scripts
          lua Development/tests/runtime.lua KenshiShop/scripts
          lua Development/tests/controller.lua KenshiShop/scripts
          lua Development/tests/duty.lua KenshiShop/scripts
          lua Development/tests/service86.lua KenshiShop/scripts
          lua Development/tests/native87.lua KenshiShop/scripts
          lua Development/tests/native88.lua KenshiShop/scripts
          lua Development/tests/post89.lua KenshiShop/scripts
          lua Development/tests/care90.lua KenshiShop/scripts
          lua Development/tests/limbs91.lua KenshiShop/scripts
          lua Development/tests/police_store.lua KenshiShop/scripts
          lua Development/tests/police_roster.lua KenshiShop/scripts
          lua Development/tests/police_orders.lua KenshiShop/scripts
          lua Development/tests/police_dialogue.lua KenshiShop/scripts
          lua Development/tests/police_patrol.lua KenshiShop/scripts
          lua Development/tests/police_recruit.lua KenshiShop/scripts
          lua Development/tests/police_services.lua KenshiShop/scripts
          lua Development/tests/police_evacuees.lua KenshiShop/scripts
          lua Development/tests/police_property.lua KenshiShop/scripts
      - name: Verify native hire and weather immunity against beta.10
        run: |
          git show v1.0-beta.10:KenshiShop/KenshiShop.mod > /tmp/kenshishop-beta10.mod
          python Development/tests/data_beta11.py /tmp/kenshishop-beta10.mod KenshiShop/KenshiShop.mod
      - name: Choose the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Package complete mod
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python tools/package_release.py --tag "$RELEASE_TAG"
          python Development/tests/beta1.py "dist/KenshiShop_${RELEASE_TAG#v}_FULL.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: KenshiShop-${{ steps.version.outputs.tag }}
          path: |
            dist/*_FULL.zip
            dist/SHA256SUMS.txt
      - name: Publish prerelease on a version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" "dist/KenshiShop_${RELEASE_TAG#v}_FULL.zip" dist/SHA256SUMS.txt --title "KenshiShop $RELEASE_TAG" --prerelease --notes-file RELEASE_NOTES.md
