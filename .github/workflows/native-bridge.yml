name: Build native node bridge
on:
  push:
    branches: [alpha89-native-posts]
    paths: ['Development/NativeBridge/**', '.github/workflows/native-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile x64 bridge with the Windows SDK
        shell: cmd
        run: cl /nologo /LD /MD /EHsc /std:c++17 /O2 /W4 /WX /DNDEBUG Development\NativeBridge\KenshiShopNative.cpp /link /OUT:KenshiShop\native\KenshiShopNative.dll
      - uses: actions/upload-artifact@v4
        with:
          name: KenshiShopNative-x64
          path: KenshiShop/native/KenshiShopNative.dll
