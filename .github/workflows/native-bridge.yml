name: Build native bridge
on:
  push:
    branches: [main]
    paths: ['Development/NativeBridge/**', '.github/workflows/native-bridge.yml']
  pull_request:
    paths: ['Development/NativeBridge/**', '.github/workflows/native-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile x64 bridge with the Windows SDK
        shell: cmd
        run: |
          if not exist KenshiShop\native mkdir KenshiShop\native
          cl /nologo /LD /MT /EHsc /std:c++17 /O2 /W4 /WX /DNDEBUG Development\NativeBridge\KenshiShopNative.cpp /link /OUT:KenshiShop\native\KenshiShopNative.dll
      - name: Check loading and cross-DLL factory ABI without running game code
        shell: cmd
        run: |
          mkdir native-probe
          cl /nologo /LD /MT /EHsc /std:c++17 /O2 Development\NativeBridge\tests\FactoryStub.cpp /link /OUT:native-probe\KenshiLib.dll
          cl /nologo /LD /MT /EHsc /std:c++17 /O2 Development\NativeBridge\tests\RuntimeStub.cpp /link /OUT:native-probe\KenshiLua.dll
          cl /nologo /MT /EHsc /std:c++17 /O2 Development\NativeBridge\tests\LoadProbe.cpp /link /OUT:native-probe\LoadProbe.exe
          copy KenshiShop\native\KenshiShopNative.dll native-probe\KenshiShopNative.dll
          cd native-probe
          LoadProbe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: KenshiShopNative-x64
          path: KenshiShop/native/KenshiShopNative.dll
